# Haskell-Plugins (coremesh-erph). Der Host lädt sie zusätzlich zu den configs
# des Kerns und von coremesh-erp:
#
#   cd ../coremesh
#   bin/host -config configs,../coremesh-erp/configs,../coremesh-erph/configs
#
# Listen ersetzen beim Zusammenführen die frühere Datei: extra_plugin_dirs nennt
# deshalb beide Verzeichnisse. Pfade relativ zum Arbeitsverzeichnis des Hosts.
host:
  extra_plugin_dirs: [../coremesh-erp/bin/plugins, ../coremesh-erph/bin/plugins]

plugins:
  # Vertragsbuchung: rechnet und bucht die Sollstellung der Verträge (contract)
  # über die Vorerfassung des Hauptbuchs (ledger). Läufe, Sollstellungen und
  # Oberfläche hält das Vertragsmodul.
  contract-billing:
    version: 0.3.0
    # Systemanfragen für die Kopie der Stammdaten (unabhängig vom buchenden Benutzer).
    ingress: true
    settings:
      cache_ttl: 1h                  # Sicherheitsnetz: Ausschnitte spätestens dann neu laden
    databases:
      main: { access: write }        # nur für Transaktionen (inTx); das Plugin hat keine Tabellen
